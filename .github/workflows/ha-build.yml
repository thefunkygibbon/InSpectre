name: Build and Push Home Assistant Add-on Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-amd64:
    name: Build AMD64 Add-on Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract base version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push AMD64 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ha
          platforms: linux/amd64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.19
          tags: |
            thefunkygibbon/inspectre-addon-amd64:${{ env.VERSION }}-${{ github.run_number }}
            thefunkygibbon/inspectre-addon-amd64:latest
          push: true
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

  build-arm64:
    name: Build ARM64 Add-on Image
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract base version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ARM64 Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ha
          platforms: linux/arm64
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.19
          tags: |
            thefunkygibbon/inspectre-addon-aarch64:${{ env.VERSION }}-${{ github.run_number }}
            thefunkygibbon/inspectre-addon-aarch64:latest
          push: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

  # NEW AUTOMATION JOB
  update-ha-addon-repo:
    name: Update HA Add-on Version Config
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository to read version
        uses: actions/checkout@v4

      - name: Extract base version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "NEW_VERSION=${VERSION}-${{ github.run_number }}" >> $GITHUB_ENV

      - name: Checkout inspectre-ha-addon repository
        uses: actions/checkout@v4
        with:
          repository: thefunkygibbon/inspectre-ha-addon
          token: ${{ secrets.AUTO_UPDATE_PAT }}
          path: ha-addon-repo

      - name: Update config.yaml with new version
        run: |
          cd ha-addon-repo
          sed -i 's/^version: .*/version: "${{ env.NEW_VERSION }}"/' inspectre/config.yaml

      - name: Commit and push changes to HA Add-on repo
        run: |
          cd ha-addon-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inspectre/config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update add-on version to ${{ env.NEW_VERSION }}" && git push)