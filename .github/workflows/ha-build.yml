name: Build & Push HA Add-on Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ha-addon:
    name: Build Home Assistant Add-on Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push AMD64 HA Add-on
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ha
          platforms: linux/amd64
          push: true
          tags: thefunkygibbon/inspectre-addon-amd64:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.19

      - name: Build & push ARM64 HA Add-on
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ha
          platforms: linux/arm64
          push: true
          tags: thefunkygibbon/inspectre-addon-aarch64:latest
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/aarch64-base:3.19